    <!-- Tailwind CSS Script -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-secondary-container": "rgb(var(--color-on-secondary-container-rgb) / <alpha-value>)",

                        "secondary-fixed-dim": "rgb(var(--color-secondary-fixed-dim-rgb) / <alpha-value>)",

                        "tertiary-fixed": "rgb(var(--color-tertiary-fixed-rgb) / <alpha-value>)",
                        "tertiary-fixed-dim": "rgb(var(--color-tertiary-fixed-dim-rgb) / <alpha-value>)",
                        "on-tertiary-fixed": "rgb(var(--color-on-tertiary-fixed-rgb) / <alpha-value>)",
                        "on-tertiary-fixed-variant": "rgb(var(--color-on-tertiary-fixed-variant-rgb) / <alpha-value>)",
                        "error": "rgb(var(--color-error-rgb) / <alpha-value>)",
                        "error-container": "rgb(var(--color-error-container-rgb) / <alpha-value>)",

                        "on-error-container": "rgb(var(--color-on-error-container-rgb) / <alpha-value>)"

                    borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },

    <!-- Script en HEAD anti-FOUC (Dark mode por defecto) -->
    <script>
        (function() {
            var theme = localStorage.getItem('theme');
            if (theme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body class="bg-background text-on-surface font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen flex">
    <!-- Componente: Sidebar de Navegación Lateral -->
    {% include "components/sidebar.html" %}

    <!-- Contenedor Principal (con margen dinámico para escritorio lg:pl-72) -->
    <div class="flex-1 flex flex-col min-w-0 lg:pl-72">
        <!-- Componente: Header Superior con selector de corpus y botón día/noche -->
        {% include "components/header.html" %}

        <!-- Bloque de Contenido Específico de cada Vista -->
        {% block content %}{% endblock %}

        <!-- Componente: Footer con SLAs y Metadatos de Inferencia -->
        {% include "components/footer.html" %}
    </div>

    <!-- Script Principal de Interacciones y Modo Día/Noche -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
