        <header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-xl border-b border-surface-container-high/40">
            <div class="h-16 sm:h-20 w-full px-3 sm:px-margin flex items-center justify-between gap-2 sm:gap-gutter">
                <div class="flex items-center gap-2 sm:gap-space-md min-w-0">
                    <button
                        class="min-w-[44px] min-h-[44px] p-2 text-on-surface hover:bg-surface-container rounded-xl lg:hidden flex items-center justify-center cursor-pointer transition-colors"
                        id="mobile-menu-btn" type="button" aria-label="Abrir Menú de Navegación">
                        <span class="material-symbols-outlined text-[24px]">menu</span>
                    </button>
                    <div
                        class="flex items-center gap-2 bg-surface-container-low px-2.5 sm:px-space-md py-1.5 sm:py-space-xs rounded-xl max-w-xs sm:max-w-md border border-surface-container-high/50">
                        <span class="material-symbols-outlined text-secondary text-[18px] shrink-0">dataset</span>
                        <div class="flex flex-col min-w-0">
                            <span class="font-label-sm text-[10px] text-outline uppercase tracking-wider truncate">Corpus Activo</span>
                            <span class="font-code-sm text-xs text-on-surface font-medium truncate">Telegram UMSA • Neon Cloud</span>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center gap-1 sm:gap-space-md">
                    <div class="hidden 2xl:flex items-center gap-space-sm">
                        <div
                            class="flex items-center gap-space-xs bg-surface-container px-space-sm py-space-xs rounded">
                            <span class="font-label-sm text-label-sm text-outline">Periodo:</span><span
                                class="font-label-sm text-label-sm text-on-surface font-medium">Últimos 90
                                días</span><span
                                class="material-symbols-outlined text-outline text-[14px]">arrow_drop_down</span>
                        </div>
                        <div
                            class="flex items-center gap-space-xs bg-surface-container px-space-sm py-space-xs rounded">
                            <span class="font-label-sm text-label-sm text-outline">Confianza:</span><span
                                class="font-label-sm text-label-sm text-tertiary font-medium">&gt; 80%</span><span
                                class="material-symbols-outlined text-outline text-[14px]">tune</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-1">
                        <!-- Botón QR para Celular / Tablet -->
                        <button id="btn-open-qr-modal"
                            class="min-w-[44px] min-h-[44px] px-2.5 py-1.5 text-on-surface-variant hover:text-primary hover:bg-surface-container rounded-xl transition-all cursor-pointer flex items-center justify-center gap-1.5 border border-surface-container-high/60 shadow-sm"
                            title="Generar Código QR para ver en Celular" type="button" aria-label="Abrir en celular mediante código QR">
                            <span class="material-symbols-outlined text-[20px] text-primary">qr_code_2</span>
                            <span class="hidden md:inline-block text-xs font-semibold text-on-surface">QR Móvil</span>
                        </button>

                        <button
                            class="theme-toggle-btn min-w-[44px] min-h-[44px] p-2 text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-xl transition-colors cursor-pointer flex items-center justify-center"
                            title="Cambiar a Modo Claro" type="button" aria-label="Cambiar tema día/noche">
                            <span class="theme-toggle-icon material-symbols-outlined text-[20px]">light_mode</span>
                        </button>
                        <button
                            class="hidden sm:flex min-w-[40px] min-h-[40px] p-2 text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-xl transition-colors items-center justify-center"
                            title="Exportar Reporte Ejecutivo" type="button"><span
                                class="material-symbols-outlined text-[20px]">download</span></button>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 ml-1">
                        <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
                    </div>
                </div>
            </div>
        </header>
